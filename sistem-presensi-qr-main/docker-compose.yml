version: '3.8'

services:
  # 1. Core Presensi Service (Laravel Utama)
  core-presensi:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./.env:/var/www/.env
    environment:
      - NOTIFICATION_SERVICE_URL=http://notification-service:5000
      - FACE_RECOGNITION_SERVICE_URL=http://face-recognition-service:8001
      - DB_CONNECTION=mysql
      - DB_HOST=host.docker.internal
      - DB_PORT=3306
      - DB_DATABASE=db_sipena
      - DB_USERNAME=root
      - DB_PASSWORD=
    depends_on:
      - notification-service
      - face-recognition-service

  # 2. Notification Microservice (Node.js)
  notification-service:
    build:
      context: ./notification-service
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - FONNTE_TOKEN=dC5U9f7jiRNsayHYgyQq

        # 3. Face Recognition Microservice (Python - YOLOv8 + Facenet)
  face-recognition-service:
    build:
      context: ./face-recognition-service
    ports:
      - "8001:8001"
    environment:
      - FACE_MODEL=Facenet
      - FACE_THRESHOLD=0.4
    volumes:
      - ./face-recognition-service/faces:/app/faces