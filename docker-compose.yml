version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sipena_app
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - .:/var/www
      - /var/www/vendor
    environment:
      - DB_HOST=host.docker.internal
      - DB_PORT=3306
      - DB_DATABASE=db_sipena
      - DB_USERNAME=root
      - DB_PASSWORD=
      - NOTIFICATION_SERVICE_URL=http://notification_service:5000
      - FACE_RECOGNITION_SERVICE_URL=http://face-recognition-service:8001
    depends_on:
      - db_main
      - db_wa
    networks:
      - sipena-network

  db_main:
    image: mysql:8.0
    container_name: db_main
    restart: unless-stopped
    ports:
      - "3308:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: db_sipena
    volumes:
      - db_main_data:/var/lib/mysql
    networks:
      - sipena-network

  db_wa:
    image: mysql:8.0
    container_name: db_wa
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: db_wa_gateway
      TZ: Asia/Jakarta
    volumes:
      - db_wa_data:/var/lib/mysql
    networks:
      - sipena-network

  notification_service:
    build:
      context: ./notification-service
      dockerfile: Dockerfile
    container_name: notification_service
    restart: unless-stopped
    ports:
      - "5000:5000"
    volumes:
      - ./notification-service:/usr/src/app
      - /usr/src/app/node_modules
    environment:
      - DB_WA_HOST=db_wa
      - DB_WA_PORT=3306
      - DB_WA_DATABASE=db_wa_gateway
      - DB_WA_USERNAME=root
      - DB_WA_PASSWORD=root
    depends_on:
      - db_wa
    networks:
      - sipena-network

  deteksi-dini-service:
    build:
      context: ./deteksi-dini-service
      dockerfile: Dockerfile
    container_name: deteksi_dini_service
    restart: unless-stopped
    ports:
      - "5002:5002"
    volumes:
      - ./deteksi-dini-service:/usr/src/app
      - /usr/src/app/node_modules
    environment:
      - DB_HOST=host.docker.internal
      - DB_PORT=3306
      - DB_DATABASE=db_sipena
      - DB_USERNAME=root
      - DB_PASSWORD=
      - DB_WA_HOST=db_wa
      - DB_WA_PORT=3306
      - DB_WA_DATABASE=db_wa_gateway
      - DB_WA_USERNAME=root
      - DB_WA_PASSWORD=root
      - NOTIFICATION_SERVICE_URL=http://notification_service:5000
      - PORT=5002
    depends_on:
      - db_wa
      - notification_service
    networks:
      - sipena-network

  face-recognition-service:
    build:
      context: ./face-recognition-service
      dockerfile: Dockerfile
    container_name: face_recognition_service
    restart: unless-stopped
    ports:
      - "8001:8001"
    volumes:
      - ./face-recognition-service:/app
    networks:
      - sipena-network

networks:
  sipena-network:
    driver: bridge

volumes:
  db_main_data:
  db_wa_data: