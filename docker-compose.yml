version: '3.8'

services:
  # 1. Aplikasi Utama Laravel
  app:
    build: .
    container_name: sipena_app
    ports:
      - "8000:80"
    depends_on:
      - db_main
    environment:
      - DB_HOST=db_main
      - DB_PORT=3306
      - DB_DATABASE=db_sipena
      - DB_USERNAME=root
      - DB_PASSWORD=root

  # 2. Database Utama (db_sipena)
  db_main:
    image: mysql:8.0
    container_name: sipena_db_main
    ports:
      - "3308:3306"
    environment:
      MYSQL_DATABASE: db_sipena
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - db_main_data:/var/lib/mysql
      
  # 3. Notification Service (Node.js)
  notification_service:
    build: ./notification-service
    container_name: sipena_notification
    ports:
      - "5000:5000"
    depends_on:
      - db_wa
    environment:
      - PORT=5000
      - DB_WA_HOST=db_wa
      - DB_WA_PORT=3306
      - DB_WA_DATABASE=db_wa_gateway
      - DB_WA_USERNAME=root
      - DB_WA_PASSWORD=root

  # 4. Database WA Gateway (db_wa_gateway)
  db_wa:
    image: mysql:8.0
    container_name: sipena_db_wa
    ports:
      - "3307:3306"
    environment:
      MYSQL_DATABASE: db_wa_gateway
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - db_wa_data:/var/lib/mysql

  # 5. ML Mock Service (API Tiruan Face ID)
  ml_service:
    image: python:3.9-slim
    container_name: sipena_ml_service
    ports:
      - "5001:5001"

volumes:
  db_main_data:
  db_wa_data: